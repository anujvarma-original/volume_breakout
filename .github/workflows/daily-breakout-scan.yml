name: Daily S&P 500 Breakout Scan

on:
  schedule:
    # 00:30 UTC daily: after the US market close and after the crypto UTC candle closes.
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install streamlit yfinance pandas numpy plotly lxml html5lib
          fi

      - name: Run daily breakout scan
        env:
          BREAKOUT_SMTP_HOST: ${{ secrets.BREAKOUT_SMTP_HOST }}
          BREAKOUT_SMTP_PORT: ${{ secrets.BREAKOUT_SMTP_PORT }}
          BREAKOUT_SMTP_USERNAME: ${{ secrets.BREAKOUT_SMTP_USERNAME }}
          BREAKOUT_SMTP_PASSWORD: ${{ secrets.BREAKOUT_SMTP_PASSWORD }}
          BREAKOUT_SENDER: ${{ secrets.BREAKOUT_SENDER }}
          BREAKOUT_RECIPIENT: ${{ secrets.BREAKOUT_RECIPIENT }}
          BREAKOUT_USE_SSL: "true"
        run: python daily_scan.py
