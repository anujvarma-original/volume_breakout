name: Daily S&P 500 Breakout Scan

on:
  schedule:
    # 13:30 UTC = 9:30 AM ET while daylight saving time is in effect.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-sp500:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install streamlit pandas numpy plotly yfinance lxml
          fi

      - name: Restore S&P scanner state
        uses: actions/cache/restore@v4
        with:
          path: |
            .sp500_daily_breakout_scan_state.json
            .sp500_breakout_signal_history.json
          key: sp500-scan-state-${{ github.run_id }}
          restore-keys: |
            sp500-scan-state-

      - name: Run S&P 500 scanner directly
        env:
          BREAKOUT_SMTP_HOST: ${{ secrets.BREAKOUT_SMTP_HOST }}
          BREAKOUT_SMTP_PORT: ${{ secrets.BREAKOUT_SMTP_PORT }}
          BREAKOUT_SMTP_USERNAME: ${{ secrets.BREAKOUT_SMTP_USERNAME }}
          BREAKOUT_SMTP_PASSWORD: ${{ secrets.BREAKOUT_SMTP_PASSWORD }}
          BREAKOUT_SENDER: ${{ secrets.BREAKOUT_SENDER }}
          BREAKOUT_RECIPIENT: ${{ secrets.BREAKOUT_RECIPIENT }}
          BREAKOUT_USE_SSL: ${{ secrets.BREAKOUT_USE_SSL }}
        run: |
          python daily_scan.py --scan sp500

      - name: Save S&P scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .sp500_daily_breakout_scan_state.json
            .sp500_breakout_signal_history.json
          key: sp500-scan-state-${{ github.run_id }}
